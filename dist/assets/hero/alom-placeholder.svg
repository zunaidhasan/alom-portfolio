<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="avatarGlow" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#2a2517" />
      <stop offset="60%" stop-color="#141414" />
      <stop offset="100%" stop-color="#0d0d0d" />
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E4B2" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8E6F18" />
    </linearGradient>
    <linearGradient id="textGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F4E5C7" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle with subtle mesh -->
  <circle cx="200" cy="200" r="190" fill="url(#avatarGlow)" />
  
  <!-- Subtle geometric grid lines reflecting logo precision -->
  <circle cx="200" cy="200" r="160" stroke="#D4AF37" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4 6" />
  <circle cx="200" cy="200" r="120" stroke="#D4AF37" stroke-opacity="0.18" stroke-width="1" />
  <line x1="200" y1="40" x2="200" y2="360" stroke="#D4AF37" stroke-opacity="0.08" stroke-width="1" />
  <line x1="40" y1="200" x2="360" y2="200" stroke="#D4AF37" stroke-opacity="0.08" stroke-width="1" />
  
  <!-- Center Monogram -->
  <text x="200" y="215" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="96" font-weight="800" fill="url(#textGold)" text-anchor="middle" dominant-baseline="middle" letter-spacing="-2">AH</text>
  
  <!-- Subtitle Tag -->
  <text x="200" y="270" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#D4AF37" text-anchor="middle" letter-spacing="4" fill-opacity="0.9">ALOM HOSSAIN</text>
  <text x="200" y="290" font-family="'Inter', sans-serif" font-size="10" font-weight="400" fill="#8E8E93" text-anchor="middle" letter-spacing="2">BRAND DESIGNER</text>

  <!-- Metallic Gold Border Ring -->
  <circle cx="200" cy="200" r="190" stroke="url(#goldBorder)" stroke-width="4" stroke-opacity="0.85" />
</svg>
